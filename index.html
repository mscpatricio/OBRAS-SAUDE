    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
      @media print {
        body * {
          visibility: hidden;
        }
        #report-container, #report-container * {
          visibility: visible;
        }
        #report-container {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          border: none;
          box-shadow: none;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
