<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pré-visualização das cenas</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .page { padding: 8mm; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .cell { border: 2px solid #999; }
  .cell .name { font: 700 9pt var(--body); padding: 1mm 2mm; background: #eee; }
</style>
</head>
<body>
<script>
  const names = ['f_cover','f_termo','f_feedback','f_coracao','f_ecg','f_volumes','f_digest','f_eixo','f_glicemia','f_ciclo','f_lab_tropo','f_lab_renal','f_lab_hepat','f_lab_tsh','f_lab_hcg','q_cover','q_gases','q_entalpia','q_gibbs','q_lechatelier','q_tampao','q_coligativas','q_cinetica','q_pilha','q_coloide','q_lab_dilui','q_lab_gaso','q_lab_enzima','q_lab_ise','q_lab_osmo','b_cover','b_tonicidade','b_membrana','b_pa','b_alveolo','b_nefron','b_radio','b_gasometria','b_oximetro','b_dialise','b_termo','b_sinais','b_soro','d_cover','d_tres','d_joao','d_teachback','d_bomba','d_roda','d_simulacao','d_debrief','d_maos','d_prova','d_tradicional','d_ativa','profWave','studentsWave','h_cover','h_triagem','h_box','h_quarto','h_noite','h_cirurgia','h_alta','h_crise','docWave','e1','e2','e3','e4','e5','e6','n_cover','n_acolhimento','n_triagem','n_vacina','n_curativo','n_coleta','n_registro','n_recompensa','n_domicilio','nurseWave','v1','v2','v3','v4','v5','v6','k_cover','k_calendar','k_prepare','k_reception','k_bib','k_glasses','k_mirror','k_suction','k_polish','k_rinse','k_next','p_dentist_mask','p_assist','o_chair','o_lamp','o_mirror','o_suction','o_spray','o_polisher','o_bib','o_glasses','o_headphones','o_cup','o_gloves','o_mask','cover','threeFormats','before_phone','before_video','before_card','waiting','tellShowDo','countTeeth','stopSign','overload','reward','homeHygiene','record','cardCover','c1_arrive','c2_wait','c3_called','c4_enter','c5_show','c6_sit','c7_open','c8_clean','c9_gift','c10_bye','sig_stop','sig_ok','sig_pause','kidWave','dentistWave','momKid'];
  const perPage = 6;
  for (let p = 0; p < names.length; p += perPage) {
    document.write('<div class="page"><div class="wrap">');
    names.slice(p, p + perPage).forEach(n => document.write(`<div class="cell"><div class="name">${n}</div><div class="ill" data-scene="${n}"></div></div>`));
    document.write('</div></div>');
  }
</script>
<script src="../shared/ill.js"></script>
</body>
</html>
